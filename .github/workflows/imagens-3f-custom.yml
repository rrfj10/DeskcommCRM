name: Imagens da 3f-custom

# Publica as imagens do fork, prova a stack num Swarm descartável e, na 3f-custom,
# chama o webhook do serviço setup no Portainer. Quem aplica o schema e atualiza os
# serviços é o setup. Fica separado do publish-image.yml, que só reage à main, para
# a sincronização com o projeto original não dar conflito.
#
# Só linux/amd64: é a arquitetura da VPS, e o build leva metade do tempo.
# Segredo do repositório: PORTAINER_WEBHOOK_SETUP. Sem ele, publica e não atualiza.

on:
  push:
    branches: ["3f-custom"]
  pull_request:
    branches: ["3f-custom"]
    paths:
      - "deploy/portainer/**"
      - ".github/workflows/imagens-3f-custom.yml"

# Sem cancelar: uma atualização cortada ao meio deixa serviços em versões diferentes.
concurrency:
  group: imagens-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  identidade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_version: ${{ steps.base.outputs.base_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolver a release base comprovada
        id: base
        run: bash deploy/portainer/identidade-build.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  publicar:
    # Candidatas de PR só são publicadas por branches deste mesmo fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: identidade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: deskcommcrm
            dockerfile: Dockerfile
          - name: deskcomm-worker
            dockerfile: Dockerfile.worker
          - name: deskcomm-scheduler
            dockerfile: Dockerfile.scheduler
          - name: deskcomm-db
            dockerfile: deploy/portainer/imagens/db.Dockerfile
          - name: deskcomm-gw
            dockerfile: deploy/portainer/imagens/gw.Dockerfile
          - name: deskcomm-setup
            dockerfile: deploy/portainer/imagens/setup.Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver versão
        id: ver
        run: echo "curta=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # A tag móvel só é promovida depois da prova, em outro job.
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:sha-${{ steps.ver.outputs.curta }}
          build-args: |
            APP_VERSION=${{ needs.identidade.outputs.base_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.identidade.outputs.base_version }}
          cache-from: type=gha,scope=3f-custom-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=3f-custom-${{ matrix.name }}

  provar:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir a stack e conferir
        run: bash deploy/portainer/prova.sh "sha-${GITHUB_SHA::7}" "$GITHUB_REPOSITORY_OWNER"

  promover:
    # A prova de um PR nunca move a tag consumida por instalações existentes.
    if: github.event_name == 'push' && github.ref_name == '3f-custom'
    needs: provar
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promover as imagens aprovadas para 3f-custom
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          versao="sha-${GITHUB_SHA::7}"
          for nome in deskcommcrm deskcomm-worker deskcomm-scheduler deskcomm-db deskcomm-gw deskcomm-setup; do
            imagem="ghcr.io/$IMAGE_OWNER/$nome"
            docker buildx imagetools create --prefer-index=false --tag "$imagem:3f-custom" "$imagem:$versao"
          done

  implantar:
    needs: promover
    if: github.ref_name == '3f-custom'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Chamar o setup no Portainer
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_SETUP }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Falta o segredo PORTAINER_WEBHOOK_SETUP: VPS não atualizada."
            exit 0
          fi
          curl -fsS -o /dev/null -X POST --max-time 120 "$WEBHOOK"
